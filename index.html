function migrateDB(d) {
  const seed = emptyDB();

  if (!d.meta || d.meta.v < 3) {
    d.subjects = d.subjects || seed.subjects;
    d.scores = (d.scores || []).map((x) =>
      x.marks !== undefined
        ? x
        : {
            id: x.id,
            studentId: x.studentId,
            subjectId: x.subjectId,
            termId: x.termId,
            marks: (x.caScore || 0) + (x.examScore || 0)
          }
    );

    d.school = { ...seed.school, ...d.school };

    if (!d.school.logo || /Sunrise/.test(d.school.name || "")) {
      d.school.logo = seed.school.logo;
      d.school.name = seed.school.name;
    }

    if (/Accra/.test(d.school.address || "")) {
      d.school.address = seed.school.address;
    }

    if (!d.school.staffCode) {
      d.school.staffCode = seed.school.staffCode;
    }
  }

  if (!d.meta || d.meta.v < 4) {
    d.scores = (d.scores || []).map((x) => {
      if (x.classMark !== undefined || x.examMark !== undefined) {
        return x;
      }

      return {
        id: x.id,
        studentId: x.studentId,
        subjectId: x.subjectId,
        termId: x.termId,
        classMark: 0,
        examMark: x.marks || 0
      };
    });

    d.users = (d.users || []).map((u) => {
      const extra = {};

      if (
        (u.role === "teacher" ||
          u.role === "accountant" ||
          u.role === "admin") &&
        u.dob === undefined
      ) {
        extra.dob = "";
      }

      if (u.role === "student" && u.guardianPhone === undefined) {
        extra.guardianPhone = "";
      }

      return Object.keys(extra).length
        ? { ...u, ...extra }
        : u;
    });
  }

  // Prepare assessment and result-approval records.
  // Existing records are preserved.
  d.assessmentActivities = Array.isArray(d.assessmentActivities)
    ? d.assessmentActivities
    : [];

  d.resultSubmissions = Array.isArray(d.resultSubmissions)
    ? d.resultSubmissions
    : [];

  d.meta = { ...(d.meta || {}), v: 5 };

  return d;
}

async function loadDB() {

async function saveDB(db) {
  // Always keep a local copy too, so the app still opens instantly next time
  // and still works if the network briefly drops.
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) { console.error(e); }

const uid = (p = "id") => `${p}_${Math.random().toString(36).slice(2, 10)}`;

function ordinal(n) {
  if (!n) return "-";
  const su = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (su[(v - 20) % 10] || su[v] || su[0]);
}

function gradeFor(scale, score) {
  const band = scale.find((b) => score >= b.min && score <= b.max);
  return band || { grade: "-", description: "-" };
}

function rankMap(items) {
  const sorted = [...items].sort((a, b) => b.value - a.value);
  const map = {};
  let pos = 0;
  sorted.forEach((it, i) => {
    if (i === 0 || it.value !== sorted[i - 1].value) pos = i + 1;
    map[it.id] = pos;
  });
  return map;
}

function computeReport(db, studentId, termId) {
  const student = db.users.find((u) => u.id === studentId);
  if (!student) return null;
  const stream = db.streams.find((s) => s.id === student.streamId);
  const cls = db.classes.find((c) => c.id === stream?.classId);
  const classmates = db.users.filter((u) => u.role === "student" && u.streamId === student.streamId);
  const perStudentTotals = {};
  classmates.forEach((cm) => { perStudentTotals[cm.id] = { sum: 0, count: 0 }; });

  const subjectResults = db.subjects.map((subject) => {
    // Only classmates with an actual score record on file compete for this
    // subject's position/ranking — a subject nobody has graded yet isn't
    // ranked, and a 0 that was never entered shouldn't masquerade as a fail.
    const entered = [];
    classmates.forEach((cm) => {
      const sc = db.scores.find((x) => x.studentId === cm.id && x.subjectId === subject.id && x.termId === termId);
      if (!sc) return;
      const classMark = sc.classMark || 0;
      const examMark = sc.examMark || 0;
      const total = classMark + examMark;
      perStudentTotals[cm.id].sum += total;
      perStudentTotals[cm.id].count += 1;
      entered.push({ id: cm.id, value: total, classMark, examMark });
    });
    const positions = rankMap(entered);
    const mine = entered.find((x) => x.id === studentId);
    const hasScore = !!mine;
    const band = hasScore ? gradeFor(db.gradingScale, mine.value) : null;
    return {
      subjectId: subject.id, name: subject.name, code: subject.code,
      hasScore,
      classMark: hasScore ? mine.classMark : null,
      examMark: hasScore ? mine.examMark : null,
      total: hasScore ? mine.value : null,
      grade: hasScore ? band.grade : null,
      description: hasScore ? band.description : null,
      position: hasScore ? positions[studentId] : null,
      outOf: entered.length,
    };
  });

  const overallItems = classmates.map((cm) => ({
    id: cm.id,
    value: perStudentTotals[cm.id].count ? perStudentTotals[cm.id].sum / perStudentTotals[cm.id].count : null,
  })).filter((x) => x.value !== null);
  const overallPositions = rankMap(overallItems);
  const myOverall = overallItems.find((x) => x.id === studentId);
  const attendance = db.attendance.find((a) => a.studentId === studentId && a.termId === termId);
  const remark = db.remarks.find((r) => r.studentId === studentId && r.termId === termId);
  const term = db.terms.find((t) => t.id === termId);
  const year = db.academicYears.find((y) => y.id === term?.academicYearId);

  return {
    student, stream, cls, term, year, subjectResults,
    overallAverage: myOverall ? myOverall.value : null,
    overallPosition: myOverall ? overallPositions[studentId] : null,
    overallOutOf: overallItems.length,
    classSize: classmates.length,
    attendance: attendance || { daysPresent: 0, totalDays: 0 },
    remark: remark || { conduct: "", teacherRemark: "", headteacherRemark: "", promotion: "" },
  };
}

const DBContext = createContext(null);
const useDB = () => useContext(DBContext);

function useDatabase() {
  const [db, setDb] = useState(null);
  const [ready, setReady] = useState(false);
  const [cloudStatus, setCloudStatus] = useState(CLOUD_ENABLED ? "connecting" : "local");

  useEffect(() => {
    if (CLOUD_ENABLED && firestoreDb) {
      const ref = firestoreDb.collection(CLOUD_COLLECTION).doc(CLOUD_DOC);
      const unsub = ref.onSnapshot(
        (snap) => {
          if (snap.exists && snap.data() && snap.data().payload) {
            const next = migrateDB(JSON.parse(snap.data().payload));
            setDb(next);
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
          } else {
            const fresh = emptyDB();
            ref.set({ payload: JSON.stringify(fresh), updatedAt: Date.now() });
            setDb(fresh);
          }
          setReady(true);
          setCloudStatus("connected");
        },
        (err) => {
          console.error("Cloud sync unavailable, using this device's local copy", err);
          setCloudStatus("error");
          loadDB().then((d) => { setDb(d); setReady(true); });
        }
      );
      return () => unsub();
    } else {
      loadDB().then((d) => { setDb(d); setReady(true); });
    }
  }, []);

  const commit = useCallback((updater) => {
    setDb((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      saveDB(next);
      return next;
    });
  }, []);

  return { db, ready, commit, cloudStatus };
}

function YearsTermsTab({ toast }) {
  const { db, commit } = useDB();
  const [yearModal, setYearModal] = useState(null); // null | {} | {edit obj}
  const [termModal, setTermModal] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  function saveYear(data) {
    commit((prev) => {
      let years = [...prev.academicYears];
      if (data.id) {
        years = years.map((y) => (y.id === data.id ? { ...y, ...data } : (data.isActive ? { ...y, isActive: false } : y)));
      } else {
        const ny = { ...data, id: uid("ay") };
        years = data.isActive ? [...years.map((y) => ({ ...y, isActive: false })), ny] : [...years, ny];
      }
      return { ...prev, academicYears: years };
    });
    toast(data.id ? "Academic year updated" : "Academic year created");
    setYearModal(null);
  }

  function saveTerm(data) {
    commit((prev) => {
      let terms = [...prev.terms];
      if (data.id) {
        terms = terms.map((t) => {
          if (t.id === data.id) return { ...t, ...data };
          if (data.isActive && t.academicYearId === data.academicYearId) return { ...t, isActive: false };
          return t;
        });
      } else {
        const nt = { ...data, id: uid("t") };
        terms = data.isActive
          ? [...terms.map((t) => (t.academicYearId === data.academicYearId ? { ...t, isActive: false } : t)), nt]
          : [...terms, nt];
      }
      return { ...prev, terms };
    });
    toast(data.id ? "Term updated" : "Term created");
    setTermModal(null);
  }

  function deleteItem() {
    if (!confirmDel) return;
    commit((prev) => {
      if (confirmDel.type === "year") {
        return { ...prev, academicYears: prev.academicYears.filter((y) => y.id !== confirmDel.id), terms: prev.terms.filter((t) => t.academicYearId !== confirmDel.id) };
      }
      return { ...prev, terms: prev.terms.filter((t) => t.id !== confirmDel.id) };
    });
    toast("Deleted");
  }

  return (
    <div className="grid lg:grid-cols-[1fr_1.4fr] gap-5">
      <Panel title="Academic Years" action={<Button size="sm" icon="Plus" onClick={() => setYearModal({})}>Add</Button>}>
        <Table
          columns={["Year", "Status", ""]}
          rows={db.academicYears}
          empty={<EmptyState icon="Calendar" title="No academic years" message="Create your first academic year to get started." />}
          renderRow={(y) => (
            <tr key={y.id} className="border-b border-[#1E2A4A]/6 last:border-0">
              <td className="py-2.5 pr-4 font-medium text-[#1E2A4A]">{y.label}</td>
              <td className="py-2.5 pr-4">{y.isActive ? <Badge tone="gold">Active</Badge> : <Badge>Inactive</Badge>}</td>
              <td className="py-2.5"><RowActions onEdit={() => setYearModal(y)} onDelete={() => setConfirmDel({ type: "year", id: y.id, label: y.label })} /></td>
            </tr>
          )}
        />
      </Panel>

      <Panel title="Terms" action={<Button size="sm" icon="Plus" onClick={() => setTermModal({})}>Add</Button>}>
        <Table
          columns={["Term", "Academic Year", "Dates", "Status", ""]}
          rows={db.terms}
          empty={<EmptyState icon="Calendar" title="No terms" message="Add terms under an academic year." />}
          renderRow={(t) => {
            const yr = db.academicYears.find((y) => y.id === t.academicYearId);
            return (
              <tr key={t.id} className="border-b border-[#1E2A4A]/6 last:border-0">
                <td className="py-2.5 pr-4 font-medium text-[#1E2A4A]">{t.label}</td>
                <td className="py-2.5 pr-4 text-[#1E2A4A]/60">{yr?.label || "—"}</td>
                <td className="py-2.5 pr-4 text-[#1E2A4A]/60 text-xs">{t.startDate} → {t.endDate}</td>
                <td className="py-2.5 pr-4">{t.isActive ? <Badge tone="gold">Active</Badge> : <Badge>Inactive</Badge>}</td>
                <td className="py-2.5"><RowActions onEdit={() => setTermModal(t)} onDelete={() => setConfirmDel({ type: "term", id: t.id, label: t.label })} /></td>
              </tr>
            );
          }}
        />
      </Panel>

      <Modal open={!!yearModal} onClose={() => setYearModal(null)} title={yearModal?.id ? "Edit Academic Year" : "New Academic Year"}>
        <YearForm initial={yearModal} onSave={saveYear} onCancel={() => setYearModal(null)} />
      </Modal>
      <Modal open={!!termModal} onClose={() => setTermModal(null)} title={termModal?.id ? "Edit Term" : "New Term"}>
        <TermForm initial={termModal} years={db.academicYears} onSave={saveTerm} onCancel={() => setTermModal(null)} />
      </Modal>
      <ConfirmDialog open={!!confirmDel} onClose={() => setConfirmDel(null)} onConfirm={deleteItem} title="Delete this record?" message={`"${confirmDel?.label}" will be permanently removed. This cannot be undone.`} />
    </div>
  );
}

function YearForm({ initial, onSave, onCancel }) {
  const [label, setLabel] = useState(initial?.label || "");
  const [isActive, setIsActive] = useState(initial?.isActive || false);
  const [error, setError] = useState("");
  function submit(e) {
    e.preventDefault();
    if (!/^\d{4}\/\d{4}$/.test(label.trim())) { setError("Use the format 2025/2026"); return; }
    onSave({ id: initial?.id, label: label.trim(), isActive });
  }
  return (
    <form onSubmit={submit} className="space-y-4">
      <Field label="Academic year label" required error={error} hint="Format: 2025/2026">
        <Input value={label} onChange={(e) => setLabel(e.target.value)} placeholder="2025/2026" />
      </Field>
      <label className="flex items-center gap-2 text-sm text-[#1E2A4A]">
        <input type="checkbox" checked={isActive} onChange={(e) => setIsActive(e.target.checked)} className="rounded accent-[#1E2A4A]" />
        Set as active academic year
      </label>
      <div className="flex justify-end gap-2 pt-2">
        <Button variant="ghost" type="button" onClick={onCancel}>Cancel</Button>
        <Button type="submit">Save</Button>
      </div>
    </form>
  );
}

function TermForm({ initial, years, onSave, onCancel }) {
  const [label, setLabel] = useState(initial?.label || "Term 1");
  const [academicYearId, setAcademicYearId] = useState(initial?.academicYearId || years[0]?.id || "");
  const [startDate, setStartDate] = useState(initial?.startDate || "");
  const [endDate, setEndDate] = useState(initial?.endDate || "");
  const [isActive, setIsActive] = useState(initial?.isActive || false);
  const [error, setError] = useState("");
  function submit(e) {
    e.preventDefault();
    if (!academicYearId) { setError("Select an academic year"); return; }
    if (startDate && endDate && startDate > endDate) { setError("Start date must be before end date"); return; }
    onSave({ id: initial?.id, label, academicYearId, startDate, endDate, isActive });
  }
  return (
    <form onSubmit={submit} className="space-y-4">
      <Field label="Term" required>
        <Select value={label} onChange={(e) => setLabel(e.target.value)}>
          <option>Term 1</option><option>Term 2</option><option>Term 3</option>
        </Select>
      </Field>
      <Field label="Academic year" required error={error}>
        <Select value={academicYearId} onChange={(e) => setAcademicYearId(e.target.value)}>
          {years.map((y) => <option key={y.id} value={y.id}>{y.label}</option>)}
        </Select>
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Start date"><Input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} /></Field>
        <Field label="End date"><Input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} /></Field>
      </div>
      <label className="flex items-center gap-2 text-sm text-[#1E2A4A]">
        <input type="checkbox" checked={isActive} onChange={(e) => setIsActive(e.target.checked)} className="rounded accent-[#1E2A4A]" />
        Set as active term
      </label>
      <div className="flex justify-end gap-2 pt-2">
        <Button variant="ghost" type="button" onClick={onCancel}>Cancel</Button>
        <Button type="submit">Save</Button>
      </div>
    </form>
  );
}

function ClassesStreamsTab({ toast }) {

function StaffImportModal({ open, onClose, toast }) {
  const { db, commit } = useDB();
  const [rows, setRows] = useState([]);
  const [fileName, setFileName] = useState("");

  function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setFileName(file.name);
    const reader = new FileReader();
    reader.onload = () => {
      const parsed = parseCSV(String(reader.result));
      const existingEmails = new Set(db.users.map((u) => u.email.toLowerCase()));
      const resolved = parsed.map((row) => {
        const name = row.Name || row.name || "";
        const dob = row.DOB || row.dob || "";
        const subjectsRaw = row.SubjectTaught || row["Subject Taught"] || row.subjects || "";
        const contact = row.Contact || row.Phone || row.phone || "";
        const email = row.Email || row.email || (name.trim() ? name.trim().toLowerCase().replace(/\s+/g, ".") + "@jhs.edu.gh" : "");
        let error = "";
        if (!name.trim()) error = "Missing name";
        else if (existingEmails.has(email.toLowerCase())) error = "Duplicate email";
        const tokens = subjectsRaw.split(/[,;]/).map((t) => t.trim()).filter(Boolean);
        const subjectIds = [];
        const unmatched = [];
        tokens.forEach((tok) => {
          const match = db.subjects.find((s) => s.code.toLowerCase() === tok.toLowerCase() || s.name.toLowerCase() === tok.toLowerCase());
          if (match) subjectIds.push(match.id); else unmatched.push(tok);
        });
        return { name: name.trim(), dob, contact: contact.trim(), email: email.trim(), subjectIds, unmatched, error };
      });
      setRows(resolved);
    };
    reader.readAsText(file);
  }

  async function downloadTemplate() {
    try {
      const downloads = window.claude ? await window.claude.use("downloads") : null;
      if (!downloads) { toast("Template download isn't available in this view"); return; }
      const csv = "Name,DOB,SubjectTaught,Contact,Email\nMrs. Ama Boateng,1991-04-10,English Language;Social Studies,0244000099,ama.boateng@jhs.edu.gh\n";
      await downloads.save({ filename: "staff_import_template.csv", data: csv });
    } catch (err) {
      if (err && err.code !== "declined") toast("Couldn't prepare the download");
    }
  }

  function commitImport() {
    const valid = rows.filter((r) => !r.error);
    if (!valid.length) { toast("No valid rows to import"); return; }
    commit((prev) => ({
      ...prev,
      users: [
        ...prev.users,
        ...valid.map((r) => ({
          id: uid("teacher"), role: "teacher", name: r.name, dob: r.dob, phone: r.contact,
          email: r.email, password: "welcome123", subjectIds: r.subjectIds,
        })),
      ],
    }));
    toast("Imported " + valid.length + " staff member" + (valid.length === 1 ? "" : "s"));
    setRows([]);
    setFileName("");
    onClose();
  }

  const validCount = rows.filter((r) => !r.error).length;
  const errorCount = rows.length - validCount;

  return (
    <Modal open={open} onClose={onClose} title="Import Staff from CSV" width="max-w-2xl">
      <div className="space-y-4">
        <div className="flex items-center justify-between gap-3 flex-wrap bg-[#1E2A4A]/5 rounded-md px-3 py-2.5">
          <p className="text-xs text-[#1E2A4A]/60">Columns: <span className="font-mono">Name, DOB, SubjectTaught, Contact, Email</span>. Separate multiple subjects with a semicolon; match by name or code (e.g. "English Language" or "ENG").</p>
          <Button size="sm" variant="outline" onClick={downloadTemplate}>Download Template</Button>
        </div>
        <label className="flex items-center justify-center gap-2 border-2 border-dashed border-[#1E2A4A]/20 rounded-lg py-6 cursor-pointer hover:bg-[#1E2A4A]/5 text-sm text-[#1E2A4A]/60">
          <Icon name="Plus" size={16} />
          {fileName || "Choose a CSV file"}
          <input type="file" accept=".csv,text/csv" className="hidden" onChange={handleFile} />
        </label>
        {rows.length > 0 && (
          <div>
            <div className="flex items-center gap-2 text-xs mb-2">
              <Badge tone="green">{validCount} ready</Badge>
              {errorCount > 0 && <Badge tone="rust">{errorCount} with errors</Badge>}
            </div>
            <div className="max-h-64 overflow-y-auto border border-[#1E2A4A]/10 rounded-lg">
              <table className="w-full text-xs">
                <thead className="bg-[#1E2A4A]/5 sticky top-0">
                  <tr className="text-left"><th className="px-2 py-1.5">Name</th><th className="px-2 py-1.5">Subjects</th><th className="px-2 py-1.5">Status</th></tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={i} className="border-t border-[#1E2A4A]/6">
                      <td className="px-2 py-1.5">{r.name || "—"}</td>
                      <td className="px-2 py-1.5">{r.subjectIds.length} matched{r.unmatched && r.unmatched.length > 0 ? ", unmatched: " + r.unmatched.join(", ") : ""}</td>
                      <td className="px-2 py-1.5">{r.error ? <span className="text-[#A6432D]">{r.error}</span> : <span className="text-[#2F5233]">Ready</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
        <div className="flex justify-end gap-2 pt-2">
          <Button variant="ghost" onClick={onClose}>Cancel</Button>
          <Button onClick={commitImport} disabled={!validCount}>Import {validCount || ""} Staff{validCount === 1 ? "" : ""}</Button>
        </div>
      </div>
    </Modal>
  );
}

function parseCSVLine(line) {
  const result = [];
  let cur = "", inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; }
      } else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ",") { result.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  result.push(cur);
  return result;
}

function parseCSV(text) {
  const lines = text.split(/\r\n|\n|\r/).filter((l) => l.trim().length > 0);
  if (!lines.length) return [];
  const headers = parseCSVLine(lines[0]).map((h) => h.trim());
  return lines.slice(1).map((line) => {
    const cells = parseCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (cells[i] || "").trim(); });
    return obj;
  });
}

function StudentImportModal({ open, onClose, toast }) {
  const { db, commit } = useDB();
  const [rows, setRows] = useState([]);
  const [fileName, setFileName] = useState("");

  function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setFileName(file.name);
    const reader = new FileReader();
    reader.onload = () => {
      const parsed = parseCSV(String(reader.result));
      const existingIndexes = new Set(db.users.filter((u) => u.role === "student").map((u) => u.indexNumber.toLowerCase()));
      const resolved = parsed.map((row) => {
        const name = row.Name || row.name || "";
        const indexNumber = row.IndexNumber || row["Index Number"] || row.indexnumber || "";
        const className = row.Class || row.class || "";
        const streamName = row.Stream || row.stream || "";
        const dob = row.DOB || row.dob || "";
        const gender = (row.Gender || row.gender || "F").toUpperCase().indexOf("M") === 0 ? "M" : "F";
        const guardianPhone = row.ParentContact || row["Parent Contact"] || row.GuardianPhone || row.guardianPhone || "";
        const email = row.Email || row.email || "";
        let error = "";
        if (!name.trim()) error = "Missing name";
        else if (!indexNumber.trim()) error = "Missing index number";
        else if (existingIndexes.has(indexNumber.trim().toLowerCase())) error = "Duplicate index number";
        let stream = null;
        if (!error) {
          const cls = db.classes.find((c) => c.name.toLowerCase() === className.trim().toLowerCase());
          stream = cls ? db.streams.find((st) => st.classId === cls.id && st.name.toLowerCase() === streamName.trim().toLowerCase()) : null;
          if (!stream) error = 'Class/stream "' + className + " " + streamName + '" not found';
        }
        return { name: name.trim(), indexNumber: indexNumber.trim(), dob, gender, guardianPhone: guardianPhone.trim(), email: email.trim(), streamId: stream ? stream.id : null, error };
      });
      setRows(resolved);
    };
    reader.readAsText(file);
  }

  async function downloadTemplate() {
    try {
      const downloads = window.claude ? await window.claude.use("downloads") : null;
      if (!downloads) { toast("Template download isn't available in this view"); return; }
      const csv = "Name,IndexNumber,DOB,Gender,Class,Stream,ParentContact,Email\nAma Serwaa,JHS/25/010,2012-03-14,F,JHS 1,A,0244000099,ama.new@jhs.edu.gh\n";
      await downloads.save({ filename: "student_import_template.csv", data: csv });
    } catch (err) {
      if (err && err.code !== "declined") toast("Couldn't prepare the download");
    }
  }

  function commitImport() {
    const valid = rows.filter((r) => !r.error);
    if (!valid.length) { toast("No valid rows to import"); return; }
    commit((prev) => ({
      ...prev,
      users: [
        ...prev.users,
        ...valid.map((r) => ({
          id: uid("student"), role: "student", name: r.name, indexNumber: r.indexNumber,
          dob: r.dob, gender: r.gender, streamId: r.streamId, guardianId: null, guardianPhone: r.guardianPhone, photo: null,
          email: r.email || (r.name.toLowerCase().replace(/\s+/g, ".") + "@jhs.edu.gh"),
          password: "student123",
        })),
      ],
    }));
    toast("Imported " + valid.length + " student" + (valid.length === 1 ? "" : "s"));
    setRows([]);
    setFileName("");
    onClose();
  }

  const validCount = rows.filter((r) => !r.error).length;
  const errorCount = rows.length - validCount;

  return (
    <Modal open={open} onClose={onClose} title="Import Students from CSV" width="max-w-2xl">
      <div className="space-y-4">
        <div className="flex items-center justify-between gap-3 flex-wrap bg-[#1E2A4A]/5 rounded-md px-3 py-2.5">
          <p className="text-xs text-[#1E2A4A]/60">Columns: <span className="font-mono">Name, IndexNumber, DOB, Gender, Class, Stream, ParentContact, Email</span>. Class/Stream must match existing ones exactly (e.g. "JHS 1", "A").</p>
          <Button size="sm" variant="outline" onClick={downloadTemplate}>Download Template</Button>
        </div>
        <label className="flex items-center justify-center gap-2 border-2 border-dashed border-[#1E2A4A]/20 rounded-lg py-6 cursor-pointer hover:bg-[#1E2A4A]/5 text-sm text-[#1E2A4A]/60">
          <Icon name="Plus" size={16} />
          {fileName || "Choose a CSV file"}
          <input type="file" accept=".csv,text/csv" className="hidden" onChange={handleFile} />
        </label>
        {rows.length > 0 && (
          <div>
            <div className="flex items-center gap-2 text-xs mb-2">
              <Badge tone="green">{validCount} ready</Badge>
              {errorCount > 0 && <Badge tone="rust">{errorCount} with errors</Badge>}
            </div>
            <div className="max-h-64 overflow-y-auto border border-[#1E2A4A]/10 rounded-lg">
              <table className="w-full text-xs">
                <thead className="bg-[#1E2A4A]/5 sticky top-0">
                  <tr className="text-left"><th className="px-2 py-1.5">Name</th><th className="px-2 py-1.5">Index No.</th><th className="px-2 py-1.5">Status</th></tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={i} className="border-t border-[#1E2A4A]/6">
                      <td className="px-2 py-1.5">{r.name || "—"}</td>
                      <td className="px-2 py-1.5 font-mono">{r.indexNumber || "—"}</td>
                      <td className="px-2 py-1.5">{r.error ? <span className="text-[#A6432D]">{r.error}</span> : <span className="text-[#2F5233]">Ready</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
        <div className="flex justify-end gap-2 pt-2">
          <Button variant="ghost" onClick={onClose}>Cancel</Button>
          <Button onClick={commitImport} disabled={!validCount}>Import {validCount || ""} Student{validCount === 1 ? "" : "s"}</Button>
        </div>
      </div>
    </Modal>
  );
}

function StudentForm({ initial, db, onSave, onCancel }) {

function GradingScalePage({ toast }) {
  const { db, commit } = useDB();
  const [rows, setRows] = useState(db.gradingScale);
  const [dirty, setDirty] = useState(false);

  useEffect(() => { setRows(db.gradingScale); setDirty(false); }, [db.gradingScale]);

  function update(id, field, value) {
    setRows((prev) => prev.map((r) => (r.id === id ? { ...r, [field]: value } : r)));
    setDirty(true);
  }
  function addRow() {
    setRows((prev) => [...prev, { id: uid("g"), min: 0, max: 0, grade: "", description: "" }]);
    setDirty(true);
  }
  function removeRow(id) {
    setRows((prev) => prev.filter((r) => r.id !== id));
    setDirty(true);
  }
  function save() {
    const sorted = [...rows].sort((a, b) => b.min - a.min);
    for (let i = 0; i < sorted.length - 1; i++) {
      if (Number(sorted[i].min) <= Number(sorted[i + 1].max)) {
        toast("Ranges overlap — check your min/max values");
        return;
      }
    }
    commit((prev) => ({ ...prev, gradingScale: sorted }));
    toast("Grading scale saved");
    setDirty(false);
  }

  return (
    <Panel
      title="Grading Scale"
      action={<div className="flex gap-2"><Button size="sm" variant="outline" icon="Plus" onClick={addRow}>Add Band</Button>{dirty && <Button size="sm" onClick={save}>Save Changes</Button>}</div>}
    >
      <p className="text-sm text-[#1E2A4A]/55 mb-4">This scale determines how numeric scores convert to grades on every report card. Changes apply school-wide.</p>
      <div className="overflow-x-auto -mx-5 px-5">
        <table className="w-full text-sm min-w-[520px]">
          <thead>
            <tr className="text-left text-[11px] uppercase tracking-wide text-[#1E2A4A]/40 border-b border-[#1E2A4A]/10">
              <th className="pb-2.5 font-medium pr-4">Min score</th>
              <th className="pb-2.5 font-medium pr-4">Max score</th>
              <th className="pb-2.5 font-medium pr-4">Grade</th>
              <th className="pb-2.5 font-medium pr-4">Description</th>
              <th className="pb-2.5"></th>
            </tr>
          </thead>
          <tbody>
            {rows.sort((a, b) => b.min - a.min).map((r) => (
              <tr key={r.id} className="border-b border-[#1E2A4A]/6 last:border-0">
                <td className="py-2 pr-4"><input type="number" value={r.min} onChange={(e) => update(r.id, "min", Number(e.target.value))} className="w-20 rounded-md border border-[#1E2A4A]/20 px-2 py-1.5 text-sm" /></td>
                <td className="py-2 pr-4"><input type="number" value={r.max} onChange={(e) => update(r.id, "max", Number(e.target.value))} className="w-20 rounded-md border border-[#1E2A4A]/20 px-2 py-1.5 text-sm" /></td>
                <td className="py-2 pr-4"><input value={r.grade} onChange={(e) => update(r.id, "grade", e.target.value)} className="w-16 rounded-md border border-[#1E2A4A]/20 px-2 py-1.5 text-sm font-medium" /></td>
                <td className="py-2 pr-4"><input value={r.description} onChange={(e) => update(r.id, "description", e.target.value)} className="w-full rounded-md border border-[#1E2A4A]/20 px-2 py-1.5 text-sm" /></td>
                <td className="py-2"><button onClick={() => removeRow(r.id)} className="p-1.5 rounded-md text-[#1E2A4A]/40 hover:bg-[#A6432D]/10 hover:text-[#A6432D]"><Icon name="Trash2" size={14}  /></button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Panel>
  );
}

function AdminResultsPage({ toast }) {
  const { db, commit } = useDB();
  const [streamId, setStreamId] = useState(db.streams[0] ? db.streams[0].id : "");
  const [subjectId, setSubjectId] = useState(db.subjects[0] ? db.subjects[0].id : "");
  const activeYear = db.academicYears.find((y) => y.isActive);
  const activeTerm = db.terms.find((t) => t.isActive && t.academicYearId === (activeYear ? activeYear.id : null));
  const [termId, setTermId] = useState(activeTerm ? activeTerm.id : (db.terms[0] ? db.terms[0].id : ""));
  const [rows, setRows] = useState({});
  const students = db.users.filter((u) => u.role === "student" && u.streamId === streamId);
  const assignment = db.subjectAssignments.find((a) => a.streamId === streamId && a.subjectId === subjectId);
  const assignedTeacher = assignment ? db.users.find((u) => u.id === assignment.teacherId) : null;

  useEffect(() => {
    const init = {};
    students.forEach((s) => {
      const sc = db.scores.find((x) => x.studentId === s.id && x.subjectId === subjectId && x.termId === termId);
      init[s.id] = { classMark: sc ? sc.classMark : "", examMark: sc ? sc.examMark : "" };
    });
    setRows(init);
  }, [streamId, subjectId, termId]);

  function update(sid, field, val) {
    const cap = field === "classMark" ? 40 : 60;
    const num = val === "" ? "" : Math.max(0, Math.min(cap, Number(val)));
    setRows((prev) => ({ ...prev, [sid]: { ...prev[sid], [field]: num } }));
  }

  function save() {
    commit((prev) => {
      let scores = [...prev.scores];
      students.forEach((s) => {
        const classMark = rows[s.id] && rows[s.id].classMark !== "" ? Number(rows[s.id].classMark) : 0;
        const examMark = rows[s.id] && rows[s.id].examMark !== "" ? Number(rows[s.id].examMark) : 0;
        const existing = scores.find((x) => x.studentId === s.id && x.subjectId === subjectId && x.termId === termId);
        if (existing) scores = scores.map((x) => (x === existing ? { ...x, classMark, examMark } : x));
        else scores = [...scores, { id: uid("score"), studentId: s.id, subjectId, termId, classMark, examMark }];
      });
      return { ...prev, scores };
    });
    toast("Marks saved");
  }

  return (
    <Panel title="Results Entry — all subjects and classes" action={<Button size="sm" onClick={save} icon="Check">Save Marks</Button>}>
      <p className="text-sm text-[#1E2A4A]/55 mb-4">As administrator you can enter or correct marks for any class and subject here. Subject teachers normally do this from their own Gradebook.</p>
      <div className="grid sm:grid-cols-3 gap-3 mb-2">
        <Field label="Stream">
          <Select value={streamId} onChange={(e) => setStreamId(e.target.value)}>
            {db.streams.map((s) => { const c = db.classes.find((x) => x.id === s.classId); return <option key={s.id} value={s.id}>{c ? c.name : ""} {s.name}</option>; })}
          </Select>
        </Field>
        <Field label="Subject">
          <Select value={subjectId} onChange={(e) => setSubjectId(e.target.value)}>
            {db.subjects.map((sub) => <option key={sub.id} value={sub.id}>{sub.name}</option>)}
          </Select>
        </Field>
        <Field label="Term">
          <Select value={termId} onChange={(e) => setTermId(e.target.value)}>
            {db.terms.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
          </Select>
        </Field>
      </div>
      <p className="text-xs text-[#1E2A4A]/45 mb-5">
        {assignedTeacher ? <>Assigned subject teacher: <span className="font-medium text-[#1E2A4A]/70">{assignedTeacher.name}</span></> : <span className="text-[#A6432D]/80">No teacher assigned to this subject for this stream yet.</span>}
      </p>
      <Table
        columns={["Student", "Class Mark (/40)", "Exam Mark (/60)", "Total"]}
        rows={students}
        empty={<EmptyState icon="GraduationCap" title="No students" message="This stream has no enrolled students." />}
        renderRow={(s) => {
          const r = rows[s.id] || { classMark: "", examMark: "" };
          const total = (Number(r.classMark) || 0) + (Number(r.examMark) || 0);
          return (
            <tr key={s.id} className="border-b border-[#1E2A4A]/6 last:border-0">
              <td className="py-2 pr-4 font-medium text-[#1E2A4A]">{s.name}</td>
              <td className="py-2 pr-4"><input type="number" min="0" max="40" value={r.classMark} onChange={(e) => update(s.id, "classMark", e.target.value)} className="w-20 rounded-md border border-[#1E2A4A]/20 px-2 py-1.5 text-sm" /></td>
              <td className="py-2 pr-4"><input type="number" min="0" max="60" value={r.examMark} onChange={(e) => update(s.id, "examMark", e.target.value)} className="w-20 rounded-md border border-[#1E2A4A]/20 px-2 py-1.5 text-sm" /></td>
              <td className="py-2 pr-4 font-medium">{total}</td>
            </tr>
          );
        }}
      />
    </Panel>
  );
}

function GradebookPage({ user, toast }) {
  const { db, commit } = useDB();

  const myAssignments = db.subjectAssignments.filter(
    (a) => a.teacherId === user.id
  );

  const streamIds = [...new Set(myAssignments.map((a) => a.streamId))];

  const [streamId, setStreamId] = useState(streamIds[0] || "");
  const subjectsForStream = myAssignments
    .filter((a) => a.streamId === streamId)
    .map((a) => a.subjectId);

  const [subjectId, setSubjectId] = useState(subjectsForStream[0] || "");

  const activeYear = db.academicYears.find((y) => y.isActive);
  const activeTerm = db.terms.find(
    (t) => t.isActive && t.academicYearId === activeYear?.id
  );

  const [termId, setTermId] = useState(
    activeTerm ? activeTerm.id : db.terms[0]?.id || ""
  );

  const [title, setTitle] = useState("");
  const [activityType, setActivityType] = useState("Class Test");
  const [week, setWeek] = useState("1");
  const [maxMarks, setMaxMarks] = useState("10");
  const [examMax, setExamMax] = useState("100");
  const [examMarks, setExamMarks] = useState({});
  const [examTouched, setExamTouched] = useState({});
  const [busy, setBusy] = useState(false);

  const students = db.users.filter(
    (u) => u.role === "student" && u.streamId === streamId
  );

  const activities = (db.assessmentActivities || []).filter(
    (a) =>
      a.streamId === streamId &&
      a.subjectId === subjectId &&
      a.termId === termId
  );

  const submission = (db.resultSubmissions || []).find(
    (x) =>
      x.streamId === streamId &&
      x.subjectId === subjectId &&
      x.termId === termId
  );

  const locked = submission?.status === "approved";
  const submitted = submission?.status === "submitted";

  useEffect(() => {
    const init = {};
    students.forEach((s) => {
      init[s.id] = "";
    });

    setExamMarks(init);
    setExamTouched({});
  }, [streamId, subjectId, termId]);

  useEffect(() => {
    if (!submission) return;

    setExamMax(String(submission.examMax || 100));
    setExamMarks(submission.examMarks || {});
    setExamTouched({});
  }, [submission?.id, submission?.updatedAt]);

  if (!streamIds.length) {
    return (
      <EmptyState
        icon="BookOpen"
        title="No subjects assigned"
        message="Ask the administrator to assign you to a subject and stream."
      />
    );
  }

  function updateActivityMark(activityId, studentId, value) {
    const activity = activities.find((a) => a.id === activityId);
    if (!activity || locked || submitted) return;

    const number = value === "" ? "" : Number(value);
    if (
      number !== "" &&
      (!Number.isFinite(number) || number < 0 || number > Number(activity.maxMarks))
    ) {
      toast(`Enter a mark between 0 and ${activity.maxMarks}`);
      return;
    }

    commit((prev) => ({
      ...prev,
      assessmentActivities: (prev.assessmentActivities || []).map((a) =>
        a.id === activityId
          ? {
              ...a,
              marks: {
                ...(a.marks || {}),
                [studentId]: value === "" ? "" : number
              },
              updatedAt: Date.now()
            }
          : a
      )
    }));
  }

  function createActivity() {
    const cleanTitle = title.trim();
    const maximum = Number(maxMarks);
    const selectedWeek = Number(week);

    if (!cleanTitle) {
      toast("Enter an assessment title");
      return;
    }

    if (!Number.isFinite(maximum) || maximum <= 0) {
      toast("Maximum marks must be greater than zero");
      return;
    }

    if (
      !Number.isInteger(selectedWeek) ||
      selectedWeek < 1 ||
      selectedWeek > 15
    ) {
      toast("Enter a week between 1 and 15");
      return;
    }

    if (locked || submitted) {
      toast("These results are locked for editing");
      return;
    }

    const activity = {
      id: uid("assessment"),
      streamId,
      subjectId,
      termId,
      title: cleanTitle,
      type: activityType,
      week: selectedWeek,
      maxMarks: maximum,
      marks: {},
      createdBy: user.id,
      createdAt: Date.now()
    };

    commit((prev) => ({
      ...prev,
      assessmentActivities: [
        ...(prev.assessmentActivities || []),
        activity
      ]
    }));

    setTitle("");
    toast("Assessment created");
  }

  function calculateCA(studentId) {
    let earned = 0;
    let possible = 0;
    let entered = 0;

    activities.forEach((activity) => {
      const mark = activity.marks?.[studentId];

      if (mark !== "" && mark !== undefined && mark !== null) {
        earned += Number(mark);
        possible += Number(activity.maxMarks);
        entered++;
      }
    });

    return {
      value: possible > 0 ? (earned / possible) * 40 : null,
      earned,
      possible,
      entered,
      totalActivities: activities.length
    };
  }

  function examValue(studentId) {
    const value = examMarks[studentId];
    const maximum = Number(examMax);

    if (
      value === "" ||
      value === undefined ||
      value === null ||
      !Number.isFinite(maximum) ||
      maximum <= 0
    ) {
      return null;
    }

    return (Number(value) / maximum) * 60;
  }

  function updateExam(studentId, value) {
    if (locked || submitted) return;

    const maximum = Number(examMax);
    const number = value === "" ? "" : Number(value);

    if (
      number !== "" &&
      (!Number.isFinite(number) || number < 0 || number > maximum)
    ) {
      toast(`Enter a mark between 0 and ${maximum}`);
      return;
    }

    setExamMarks((prev) => ({ ...prev, [studentId]: value }));
    setExamTouched((prev) => ({ ...prev, [studentId]: true }));
  }

  function buildScoreRecords(prevScores) {
   ...
}

  function buildScoreRecords(prevScores) {
  let scores = [...(prevScores || [])];

  students.forEach((student) => {
    const ca = calculateCA(student.id).value;
    const exam = examValue(student.id);

    const existingIndex = scores.findIndex(
      (x) =>
        x.studentId === student.id &&
        x.subjectId === subjectId &&
        x.termId === termId
    );

    // Do not create a score record if the student has no CA
    // and no examination mark.
    if (ca === null && exam === null) return;

    const record = {
      ...(existingIndex >= 0 ? scores[existingIndex] : {}),

      id:
        existingIndex >= 0
          ? scores[existingIndex].id
          : uid("score"),

      studentId: student.id,
      subjectId,
      termId,

      // CA is already scaled to 40
      classMark:
        ca === null
          ? 0
          : Number(ca.toFixed(2)),

      // Examination is already scaled to 60
      examMark:
        exam === null
          ? 0
          : Number(exam.toFixed(2)),

      // Final total is out of 100
      total: Number(
        ((ca || 0) + (exam || 0)).toFixed(2)
      ),

      updatedAt: Date.now(),

      // Helps identify that the record came from Gradebook
      source: "gradebook"
    };

    if (existingIndex >= 0) {
      scores[existingIndex] = record;
    } else {
      scores.push(record);
    }
  });

  return scores;
}

          x.subjectId === subjectId &&
          x.termId === termId
      );

  scores: buildScoreRecords(prev.scores),

  resultSubmissions: old
    ? (prev.resultSubmissions || []).map((x) =>

};
    });

          </Field>

            Scores are converted automatically to a mark out of 60.
          </p>
        </div>

        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b text-left">
                <th className="py-2 pr-3">Student</th>
                <th className="py-2 pr-3">Exam score</th>
                <th className="py-2 pr-3">Exam /60</th>
                <th className="py-2 pr-3">CA /40</th>
                <th className="py-2">Total /100</th>
              </tr>
            </thead>

            <tbody>
              {students.map((student) => {
                const ca = calculateCA(student.id);
                const exam = examValue(student.id);
                const total =
                  ca.value !== null && exam !== null
                    ? ca.value + exam
                    : null;

                return (
                  <tr
                    key={student.id}
                    className="border-b border-[#1E2A4A]/10"
                  >
                    <td className="py-2 pr-3 font-medium">
                      {student.name}
                    </td>

                    <td className="py-2 pr-3">
                      <input
                        type="number"
                        min="0"
                        max={Number(examMax)}
                        value={examMarks[student.id] ?? ""}
                        disabled={locked || submitted}
                        onChange={(e) =>
                          updateExam(student.id, e.target.value)
                        }
                        className="w-24 rounded-md border border-[#1E2A4A]/20 px-2 py-1.5"
                      />
                    </td>

                    <td className="py-2 pr-3">
                      {exam === null ? "—" : exam.toFixed(2)}
                    </td>

                    <td className="py-2 pr-3">
                      {ca.value === null ? "—" : ca.value.toFixed(2)}
                    </td>

                    <td className="py-2 font-semibold">
                      {total === null ? "Incomplete" : total.toFixed(2)}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        <div className="mt-5 flex flex-wrap gap-3">
          <Button
            onClick={saveDraft}
            icon="Save"
            disabled={locked || submitted}
          >
            Save Draft
          </Button>

          <Button
            onClick={submitResults}
            icon="Check"
            disabled={locked || submitted}
          >
            Submit for Approval
          </Button>
        </div>

        {(locked || submitted) && (
          <p className="mt-3 text-sm text-[#1E2A4A]/70">
            {locked
              ? "These results have been approved and are locked."
              : "These results have been submitted and are locked while awaiting review."}
          </p>
        )}
      </Panel>
    </div>
  );
}
function AttendanceRemarksPage({ user, toast }) {
  const { db, commit } = useDB();
  const myStream = db.streams.find((s) => s.classTeacherId === user.id);
  const activeYear = db.academicYears.find((y) => y.isActive);
  const activeTerm = db.terms.find((t) => t.isActive && t.academicYearId === (activeYear ? activeYear.id : null));
  const [termId, setTermId] = useState(activeTerm ? activeTerm.id : (db.terms[0] ? db.terms[0].id : ""));
  const [rows, setRows] = useState({});
  const students = myStream ? db.users.filter((u) => u.role === "student" && u.streamId === myStream.id) : [];

  useEffect(() => {
    const init = {};
    students.forEach((s) => {
      const att = db.attendance.find((a) => a.studentId === s.id && a.termId === termId);
      const rem = db.remarks.find((r) => r.studentId === s.id && r.termId === termId);
      init[s.id] = { present: att ? att.daysPresent : "", total: att ? att.totalDays : "", conduct: rem ? rem.conduct : "", remark: rem ? rem.teacherRemark : "" };
    });
    setRows(init);
  }, [termId, myStream ? myStream.id : null]);

  if (!myStream) return <EmptyState icon="Calendar" title="Not a class teacher" message="Attendance and remarks are entered by each stream's assigned class teacher." />;

  function update(sid, field, val) { setRows((prev) => ({ ...prev, [sid]: { ...prev[sid], [field]: val } })); }

  function save() {
    commit((prev) => {
      let attendance = [...prev.attendance];
      let remarks = [...prev.remarks];
      students.forEach((s) => {
        const r = rows[s.id] || {};
        const present = Number(r.present) || 0, total = Number(r.total) || 0;
        const exAtt = attendance.find((a) => a.studentId === s.id && a.termId === termId);
        attendance = exAtt ? attendance.map((a) => (a === exAtt ? { ...a, daysPresent: present, totalDays: total } : a)) : [...attendance, { id: uid("att"), studentId: s.id, termId, daysPresent: present, totalDays: total }];
        const exRem = remarks.find((x) => x.studentId === s.id && x.termId === termId);
        remarks = exRem ? remarks.map((x) => (x === exRem ? { ...x, conduct: r.conduct || "", teacherRemark: r.remark || "" } : x)) : [...remarks, { id: uid("rem"), studentId: s.id, termId, conduct: r.conduct || "", teacherRemark: r.remark || "", headteacherRemark: "", promotion: "" }];
      });
      return { ...prev, attendance, remarks };
    });
    toast("Attendance and remarks saved");
  }

  return (
    <Panel title="Attendance & Remarks &mdash; my class" action={<Button size="sm" onClick={save} icon="Check">Save</Button>}>
      <div className="max-w-xs mb-5">
        <Field label="Term"><Select value={termId} onChange={(e) => setTermId(e.target.value)}>{db.terms.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</Select></Field>
      </div>
      <div className="space-y-4">
        {students.map((s) => {
          const r = rows[s.id] || {};
          return (
            <div key={s.id} className="border border-[#1E2A4A]/10 rounded-lg p-3.5">
              <div className="font-medium text-[#1E2A4A] text-sm mb-2.5">{s.name}</div>
              <div className="grid sm:grid-cols-4 gap-2.5">
                <Input type="number" placeholder="Days present" value={r.present || ""} onChange={(e) => update(s.id, "present", e.target.value)} />
                <Input type="number" placeholder="Total days" value={r.total || ""} onChange={(e) => update(s.id, "total", e.target.value)} />
                <Select value={r.conduct || ""} onChange={(e) => update(s.id, "conduct", e.target.value)}>
                  <option value="">Conduct &mdash;</option>
                  <option>Excellent</option><option>Very Good</option><option>Good</option><option>Fair</option><option>Needs Improvement</option>
                </Select>
                <Input placeholder="Teacher's remark" value={r.remark || ""} onChange={(e) => update(s.id, "remark", e.target.value)} />
              </div>
            </div>
          );
        })}
      </div>
    </Panel>
  );
}

function AdminReportsPage({ toast }) {
  const { db, commit } = useDB();
  const [streamId, setStreamId] = useState(db.streams[0] ? db.streams[0].id : "");
  const activeYear = db.academicYears.find((y) => y.isActive);
  const activeTerm = db.terms.find((t) => t.isActive && t.academicYearId === (activeYear ? activeYear.id : null));
  const [termId, setTermId] = useState(activeTerm ? activeTerm.id : (db.terms[0] ? db.terms[0].id : ""));
  const [studentId, setStudentId] = useState("");
  const students = db.users.filter((u) => u.role === "student" && u.streamId === streamId);

  function onSaveRemark(data) {
    commit((prev) => {
      const ex = prev.remarks.find((r) => r.studentId === studentId && r.termId === termId);
      const remarks = ex ? prev.remarks.map((r) => (r === ex ? { ...r, ...data } : r)) : [...prev.remarks, { id: uid("rem"), studentId, termId, ...data }];
      return { ...prev, remarks };
    });
    toast("Report updated");
  }

  function onUpdatePhoto(sid, dataUri) {
    commit((prev) => ({ ...prev, users: prev.users.map((u) => (u.id === sid ? { ...u, photo: dataUri } : u)) }));
    toast("Photo updated");
  }

  return (
    <div className="space-y-5">
      <Panel title="Select class and student">
        <div className="grid sm:grid-cols-3 gap-3">
          <Field label="Stream">
            <Select value={streamId} onChange={(e) => { setStreamId(e.target.value); setStudentId(""); }}>
              {db.streams.map((s) => { const c = db.classes.find((x) => x.id === s.classId); return <option key={s.id} value={s.id}>{c ? c.name : ""} {s.name}</option>; })}
            </Select>
          </Field>
          <Field label="Term">
            <Select value={termId} onChange={(e) => setTermId(e.target.value)}>{db.terms.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}</Select>
          </Field>
          <Field label="Student">
            <Select value={studentId} onChange={(e) => setStudentId(e.target.value)}>
              <option value="">&mdash; Select &mdash;</option>
              {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
            </Select>
          </Field>
        </div>
      </Panel>
      {studentId ? (
        <ReportCardView db={db} studentId={studentId} termId={termId} editable onSaveRemark={onSaveRemark} onUpdatePhoto={onUpdatePhoto} />
      ) : (
        <EmptyState icon="ClipboardList" title="Select a student" message="Choose a stream, term and student to view or print their terminal report." />
      )}
    </div>
  );
}

/* ============================================================
   ROOT APP
   ============================================================ */

const SESSION_KEY = "jhs_lms_session_v1";

function App() {
  const { db, ready, commit, cloudStatus } = useDatabase();
  const [user, setUser] = useState(null);
  const [sessionChecked, setSessionChecked] = useState(false);
  const [page, setPage] = useState("dashboard");
  const [toastMsg, setToastMsg] = useState(null);

  const showToast = useCallback((msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(null), 2200);
  }, []);

  const handleLogin = useCallback((u) => {
    try { localStorage.setItem(SESSION_KEY, u.id); } catch (e) {}
    setUser(u);
  }, []);

  const handleLogout = useCallback(() => {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    setUser(null);
  }, []);

  // Restore a previous session on refresh, once the database has loaded.
  useEffect(() => {
    if (!ready || sessionChecked) return;
    let savedId = null;
    try { savedId = localStorage.getItem(SESSION_KEY); } catch (e) {}
    if (savedId) {
      const found = db.users.find((u) => u.id === savedId);
      if (found) setUser(found);
      else { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }
    }
    setSessionChecked(true);
  }, [ready, sessionChecked, db]);

  // If the signed-in user's own record changes (edited on this device or
  // synced in from another), keep the active session showing current data
  // instead of a stale snapshot from the moment they logged in.
  useEffect(() => {
    if (!user || !db) return;
    const fresh = db.users.find((u) => u.id === user.id);
    if (!fresh) { handleLogout(); return; }
    if (JSON.stringify(fresh) !== JSON.stringify(user)) setUser(fresh);
  }, [db]);

  useEffect(() => { setPage("dashboard"); }, [user?.id]);

  if (!ready || !sessionChecked) {
    return (
      <div className="min-h-screen bg-[#1E2A4A] flex items-center justify-center">
        <div className="text-white/50 text-sm">Loading…</div>
      </div>
    );
  }

  if (!user) {
    return <LoginScreen onLogin={handleLogin} users={db.users} school={db.school} cloudStatus={cloudStatus} onRegister={(u) => { commit((prev) => ({ ...prev, users: [...prev.users, u] })); handleLogin(u); }} />;
  }

  const activeYear = db.academicYears.find((y) => y.isActive);
  const activeTerm = db.terms.find((t) => t.isActive && t.academicYearId === activeYear?.id);

  let content = null;
  if (user.role === "admin") {
    if (page === "dashboard") content = <AdminDashboard activeTerm={activeTerm} activeYear={activeYear} />;
    else if (page === "academic") content = <AcademicSetupPage toast={showToast} />;
    else if (page === "staff") content = <StaffPage toast={showToast} />;
    else if (page === "students") content = <StudentsPage toast={showToast} />;
    else if (page === "results") content = <AdminResultsPage toast={showToast} />;
    else if (page === "reports") content = <AdminReportsPage toast={showToast} />;
    else if (page === "grading") content = <GradingScalePage toast={showToast} />;
    else if (page === "settings") content = <SchoolSettingsPage toast={showToast} />;
  } else if (user.role === "teacher") {
    if (page === "dashboard") content = <GenericDashboard user={user} />;
    else if (page === "gradebook") content = <GradebookPage user={user} toast={showToast} />;
    else if (page === "attendance") content = <AttendanceRemarksPage user={user} toast={showToast} />;
    else if (page === "students") content = <StudentsPage toast={showToast} scopedStreamId={db.streams.find((s) => s.classTeacherId === user.id)?.id} readOnly />;
    else content = <ComingSoon label={(NAV_BY_ROLE.teacher.find((n) => n.id === page) || {}).label} />;
  } else if (user.role === "student") {
    if (page === "dashboard") content = <GenericDashboard user={user} />;
    else if (page === "reports") content = <StudentReportsPage user={user} />;
    else content = <ComingSoon label={(NAV_BY_ROLE[user.role].find((n) => n.id === page) || {}).label} />;
  } else if (user.role === "parent") {
    if (page === "dashboard") content = <GenericDashboard user={user} />;
    else if (page === "reports") content = <ParentReportsPage user={user} />;
    else content = <ComingSoon label={(NAV_BY_ROLE[user.role].find((n) => n.id === page) || {}).label} />;
  } else {
    if (page === "dashboard") content = <GenericDashboard user={user} />;
    else content = <ComingSoon label={(NAV_BY_ROLE[user.role].find((n) => n.id === page) || {}).label} />;
  }

  return (
    <DBContext.Provider value={{ db, commit }}>
      <Shell user={user} page={page} setPage={setPage} onLogout={handleLogout} activeTerm={activeTerm} activeYear={activeYear} school={db.school} cloudStatus={cloudStatus}>
        {content}
      </Shell>
      <Toast toast={toastMsg} />
      <style>{`
        @keyframes fadein { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
        .font-serif { font-family: 'Source Serif 4', ui-serif, Georgia, serif; }
      `}</style>
    </DBContext.Provider>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
